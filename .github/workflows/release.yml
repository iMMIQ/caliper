name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries in Ubuntu 22.04
        shell: bash
        run: |
          docker build \
            --platform linux/${{ matrix.arch }} \
            --target builder \
            --tag caliper-builder:${{ steps.meta.outputs.version }}-${{ matrix.arch }} \
            .

      - name: Run workspace tests
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          docker run --rm \
            caliper-builder:${{ steps.meta.outputs.version }}-${{ matrix.arch }} \
            cargo test --workspace --locked

      - name: Package binaries
        shell: bash
        run: |
          version=${{ steps.meta.outputs.version }}
          package=caliper-${version}-linux-${{ matrix.arch }}
          mkdir -p "release/${package}/bin" "release/${package}/config"

          container_id=$(docker create caliper-builder:${version}-${{ matrix.arch }})
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/build/target/release/caliper" "release/${package}/bin/"
          docker cp "$container_id:/build/target/release/caliper-runner" "release/${package}/bin/"
          docker cp "$container_id:/build/target/release/caliper-transfer" "release/${package}/bin/"
          docker rm "$container_id"
          trap - EXIT

          cp config/default.toml "release/${package}/config/"
          cp LICENSE README.md "release/${package}/"
          tar -C release -cJf "release/${package}.tar.xz" "${package}"
          rm -rf "release/${package}"

      - name: Build runtime image
        shell: bash
        run: |
          version=${{ steps.meta.outputs.version }}
          docker build \
            --platform linux/${{ matrix.arch }} \
            --target runtime \
            --tag caliper:${version}-${{ matrix.arch }} \
            .
          test "$(docker image inspect caliper:${version}-${{ matrix.arch }} --format '{{.Architecture}}')" = "${{ matrix.arch }}"

      - name: Package runtime image
        shell: bash
        run: |
          version=${{ steps.meta.outputs.version }}
          archive=release/caliper-docker-${version}-linux-${{ matrix.arch }}.tar
          docker save --output "$archive" caliper:${version}-${{ matrix.arch }}
          xz -T0 -6 "$archive"
          xz --test "${archive}.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release/*.tar.xz
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish release and container image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate release files
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          for arch in amd64 arm64; do
            test -s "dist/caliper-${version}-linux-${arch}.tar.xz"
            test -s "dist/caliper-docker-${version}-linux-${arch}.tar.xz"
          done
          xz --test dist/*.tar.xz
          (cd dist && sha256sum *.tar.xz > SHA256SUMS)

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish multi-architecture image to GHCR
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          for arch in amd64 arm64; do
            xz -dc "dist/caliper-docker-${version}-linux-${arch}.tar.xz" | docker load
            docker tag "caliper:${version}-${arch}" "${image}:${version}-${arch}"
            docker push "${image}:${version}-${arch}"
          done

          manifest_tags=(--tag "${image}:${version}")
          if [[ "$version" != *-* ]]; then
            manifest_tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create \
            "${manifest_tags[@]}" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.xz
            dist/SHA256SUMS
